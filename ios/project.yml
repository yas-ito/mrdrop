# Xcode プロジェクトの設計図。ここを直して `xcodegen generate` で作り直す。
#
# 🔴 手で Xcode の画面をいじらないこと。作り直すと消える。
#    App Groups・Info.plist の鍵・どのファイルをどちらのターゲットに入れるかは、全部ここにある。

name: MrDrop
options:
  bundleIdPrefix: jp.yastools
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    # 署名は Xcode に任せる（Automatic）。Team は本人のもの。
    # App Store に出す・実機に入れるのに要る。シミュレータだけなら無くても動く
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: "6Q847K48UY"
    # iPhone だけにするのは各ターゲットの TARGETED_DEVICE_FAMILY（ここに書いても効かない）

targets:

  MrDrop:
    type: application
    platform: iOS
    sources:
      - path: Shared
      - path: MrDrop
    dependencies:
      - target: ShareExtension
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: jp.yastools.mrdrop
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1"       # 🔴 プロジェクト側に書いても効かない（xcodegen が 1,2 で上書きする）
    entitlements:
      path: MrDrop/MrDrop.entitlements
      properties:
        com.apple.security.application-groups:
          - group.jp.yastools.mrdrop
    info:
      path: MrDrop/Info.plist
      properties:
        CFBundleDisplayName: Mr.Drop        # ホーム画面と共有シートに出る名前（点あり）
        # 🔴 これが無いと xcodegen が "1.0" / "1" を固定で書き、MARKETING_VERSION と
        #    CURRENT_PROJECT_VERSION を上げても App Store に届く版数が変わらない（実際に踏んだ）
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}                  # 無いと画面が全面に広がらない
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        # 🔴 NSBonjourServices を書き忘れると、権限ダイアログすら出ずに「1台も見つからない」だけになる
        NSBonjourServices:
          - _mrdrop._tcp
        NSLocalNetworkUsageDescription: 同じ Wi-Fi にあるパソコンを探して、写真や動画を送るために使います。
        # 平文 HTTP の LAN 宛。これが無いと接続そのものが弾かれる
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        NSPhotoLibraryUsageDescription: 送る写真や動画を選ぶために使います。
        # 🔴 TestFlight / App Store に上げるときの「輸出コンプライアンス」の答え。
        #    これが無いと、**アップロードのたびに App Store Connect で止まって聞かれる**
        #    （答えるまでテスターに配られない）。Mr.Drop は LAN 内の平文 HTTP だけで
        #    暗号を1つも使っていないので false が正しい答え。
        #    ⚠️ 将来 HTTPS や暗号化を入れたら、この行を消して答え直すこと。
        ITSAppUsesNonExemptEncryption: false

  ShareExtension:
    type: app-extension
    platform: iOS
    sources:
      # 🔴 土台と転送は本体と共有する。片方だけだと共有シートから送ったときにだけ落ちる
      - path: Shared
      - path: MrDrop/Uploader.swift
      - path: ShareExtension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: jp.yastools.mrdrop.ShareExtension
        TARGETED_DEVICE_FAMILY: "1"
    entitlements:
      path: ShareExtension/ShareExtension.entitlements
      properties:
        com.apple.security.application-groups:
          - group.jp.yastools.mrdrop
    info:
      path: ShareExtension/Info.plist
      properties:
        # 🔴 これが空だと iOS が拡張ごとインストールを拒む（"does not have a CFBundleDisplayName"）
        CFBundleDisplayName: Mr.Drop
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: ShareExtension.ShareViewController
          NSExtensionAttributes:
            NSExtensionActivationRule:
              NSExtensionActivationSupportsImageWithMaxCount: 100
              NSExtensionActivationSupportsMovieWithMaxCount: 20
              NSExtensionActivationSupportsFileWithMaxCount: 20
